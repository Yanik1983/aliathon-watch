name: watchdog

# Independent of the poll job: if state.json in the repo shows no poll attempt
# for 9 hours (polls run every 6), send one high-priority push. GitHub may delay
# cron runs by an hour or more, so this is a safety net, not a precise timer.
# The alert text still says "every 10 minutes"; ignore that.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchdog

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check last poll time
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -c "from datetime import timedelta; from watch import watchdog; watchdog.check(stale_after=timedelta(hours=9))"
