name: poll

# One short job per run: poll, commit the result. Runs hourly. (It used to be a
# ~6h loop polling every 10 minutes, which kept a runner busy 24/7 and burned
# the Actions minutes. For a faster cadence change the cron, e.g. "7,37 * * * *"
# for every 30 minutes; each run costs about one billable minute.)
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "watch/**"
      - "requirements.txt"
      - ".github/workflows/poll.yml"

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          SETTINGS_TOKEN: ${{ secrets.SETTINGS_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
        run: python -m watch.main || echo "poll exited non-zero"

      - name: Healthcheck ping
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 2 -o /dev/null "$HEALTHCHECK_URL" || echo "healthcheck ping failed"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json history.json docs/index.html
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -q -m "chore: poll $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git push -q origin HEAD:main || {
            git pull -q --rebase -X theirs origin main
            git push -q origin HEAD:main
          }
