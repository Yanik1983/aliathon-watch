name: settings

# Dispatched by the "Notification settings" card on the status page (or manually
# from the Actions tab). Validates the inputs, commits settings.json, and sends a
# confirmation push. The poll loop rebases onto main before every poll, so the
# change is live within 10 minutes without restarting it.
on:
  workflow_dispatch:
    inputs:
      rooms:
        description: "Comma-separated room codes, e.g. 1BED,S1BED"
        required: true
        type: string
      min_nights:
        description: "Minimum nights"
        required: true
        type: string
      max_nights:
        description: "Maximum nights"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: settings

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validate and write settings.json
        env:
          ROOMS: ${{ inputs.rooms }}
          MIN_NIGHTS: ${{ inputs.min_nights }}
          MAX_NIGHTS: ${{ inputs.max_nights }}
        run: python -m watch.settings --rooms "$ROOMS" --min "$MIN_NIGHTS" --max "$MAX_NIGHTS"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.json
          if git diff --cached --quiet; then
            echo "settings unchanged"
            exit 0
          fi
          git commit -q -m "chore: settings $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          for attempt in 1 2 3; do
            if git push -q origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            # During a rebase "ours" is the upstream side; "theirs" is the commit being
            # replayed, i.e. this run's settings.json, which must win.
            git pull -q --rebase -X theirs origin main || { git rebase --abort; exit 1; }
          done
          echo "could not push settings.json"
          exit 1

      - name: Confirmation push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
        run: |
          python - <<'EOF'
          from watch import notify, settings
          s = settings.load("settings.json")
          notify.send(
              "Aliathon: settings updated",
              f"Rooms: {', '.join(s.rooms)}\nStay: {s.min_nights}-{s.max_nights} nights",
              priority="low",
              tags="gear",
          )
          EOF
