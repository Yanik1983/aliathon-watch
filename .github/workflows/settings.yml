name: settings

# Dispatched by the "Notification settings" card on the status page (or manually
# from the Actions tab). Validates the settings JSON, commits settings.json, runs
# one poll so the page and any bookable-stay alert reflect the change right away,
# and sends a confirmation push. The poll loop rebases onto main before every
# poll, so it picks the file up as well without restarting.
on:
  workflow_dispatch:
    inputs:
      settings:
        description: >-
          JSON object, e.g. {"rooms":["1BED","S1BED"],"min_nights":5,"max_nights":8,
          "first_checkin":"2027-08-14","last_checkout":"2027-08-29","adults":2,
          "children":2,"packages":[],"price_alerts":"all","max_price":null}
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: settings

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validate and write settings.json
        env:
          SETTINGS: ${{ inputs.settings }}
        run: python -m watch.settings --json "$SETTINGS"

      - name: Poll once with the new settings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          SETTINGS_TOKEN: ${{ secrets.SETTINGS_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
        run: python -m watch.main || echo "poll exited non-zero"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.json state.json history.json docs/index.html
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -q -m "chore: settings $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          for attempt in 1 2 3; do
            if git push -q origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            # During a rebase "theirs" is the commit being replayed, i.e. this run's
            # files, which must win over a poll commit that landed meanwhile.
            git pull -q --rebase -X theirs origin main || { git rebase --abort; exit 1; }
          done
          echo "could not push"
          exit 1

      - name: Confirmation push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
        run: |
          python - <<'EOF'
          from watch import notify, settings
          s = settings.load("settings.json")
          notify.send("Aliathon: settings updated", settings.describe(s), priority="low", tags="gear")
          EOF
